[project]
name = "comfyui-graph-grid"
description = "XY plots for any ComfyUI workflow: vary any widget on any node from a grid editor and render a labelled grid in one queue."
version = "0.1.2"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["comfyui", "xy plot", "grid", "comparison", "lora", "sweep"]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.urls]
Repository = "https://github.com/Mr-Quin/comfyui-graph-grid"
Documentation = "https://github.com/Mr-Quin/comfyui-graph-grid#readme"
"Bug Tracker" = "https://github.com/Mr-Quin/comfyui-graph-grid/issues"

[tool.comfy]
PublisherId = "mr-quin"
DisplayName = "Graph Grid"
requires-comfyui = ">=0.3.0"
Icon = "https://raw.githubusercontent.com/Mr-Quin/comfyui-graph-grid/main/docs/icon.png"
Banner = "https://raw.githubusercontent.com/Mr-Quin/comfyui-graph-grid/main/docs/hero.png"
